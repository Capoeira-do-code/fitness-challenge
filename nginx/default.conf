gzip on;
gzip_vary on;
gzip_proxied any;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

sendfile on;
tcp_nopush on;
tcp_nodelay on;
keepalive_timeout 65;
server_tokens off;

limit_req_zone $binary_remote_addr zone=fitness_requests:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=fitness_connections:10m;
log_format fitness_security escape=json
    '{"time":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
    '"host":"$host","path":"$uri","status":$status,"bytes":$body_bytes_sent,'
    '"duration":$request_time,"user_agent":"$http_user_agent"}';

server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php;
    client_max_body_size 15M;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    access_log /var/log/nginx/fitness/access.log fitness_security;
    error_log /var/log/nginx/fitness/error.log warn;
    limit_req zone=fitness_requests burst=80 nodelay;
    limit_req_status 429;
    limit_conn fitness_connections 30;
    limit_conn_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location ~* ^/(?:\.env(?:\..*)?|\.git|\.svn|\.hg|info|phpinfo|php-info|php_info|phpversion|_phpinfo|old_phpinfo|server-info|server-status|_profiler|_environment|_debugbar|telescope|actuator|vendor/phpunit|wp-admin|wp-login)(?:\.php)?(?:/|$) {
        return 404;
    }

    location ^~ /uploads/ {
        return 403;
    }

    location ^~ /assets/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/(?:index|asset)\.php$ {
        include fastcgi_params;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass app:9000;
        fastcgi_connect_timeout 15s;
        fastcgi_send_timeout 120s;
        fastcgi_read_timeout 120s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_keep_conn on;
    }

    location ~ \.php(?:/|$) {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/local.crt;
    ssl_certificate_key /etc/nginx/certs/local.key;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/public;
    index index.php;
    client_max_body_size 15M;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 30s;
    access_log /var/log/nginx/fitness/access.log fitness_security;
    error_log /var/log/nginx/fitness/error.log warn;
    limit_req zone=fitness_requests burst=80 nodelay;
    limit_req_status 429;
    limit_conn fitness_connections 30;
    limit_conn_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location ~* ^/(?:\.env(?:\..*)?|\.git|\.svn|\.hg|info|phpinfo|php-info|php_info|phpversion|_phpinfo|old_phpinfo|server-info|server-status|_profiler|_environment|_debugbar|telescope|actuator|vendor/phpunit|wp-admin|wp-login)(?:\.php)?(?:/|$) {
        return 404;
    }

    location ^~ /uploads/ {
        return 403;
    }

    location ^~ /assets/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/(?:index|asset)\.php$ {
        include fastcgi_params;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass app:9000;
        fastcgi_connect_timeout 15s;
        fastcgi_send_timeout 120s;
        fastcgi_read_timeout 120s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_keep_conn on;
    }

    location ~ \.php(?:/|$) {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}
